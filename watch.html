<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>卫星状态 · 手表版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; background: #000; color: #e8eef9; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { overflow: hidden; position: fixed; inset: 0; user-select: none; -webkit-user-select: none; }

  /* 页面：铺满全屏 + 圆形安全边距 */
  .page { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 11% 9% 18%; min-height: 0; }
  .page.hide { display: none; }

  /* ---- 首页 ---- */
  #p1 { align-items: center; text-align: center; justify-content: space-evenly; padding-top: 3vh; padding-bottom: 2vh; }
  .brands { display: flex; align-items: center; gap: 2.6vw; }
  .brand { display: flex; align-items: center; gap: 1.2vw; }
  .brand img { height: 4.6vw; width: auto; }
  .brand span { font-size: 3.6vw; font-weight: 800; color: #fff; }
  .brand.amsat span { color: #1d4ed8; letter-spacing: 1px; }
  .sep { width: 0.3vw; height: 4.8vw; background: #2a2a2a; }
  .utc { font-size: 20vw; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.2vw; text-indent: 0.2vw; line-height: 1; }
  .utc-lbl { font-size: 3.6vw; color: #8f9cb8; letter-spacing: 1.6vw; text-indent: 1.6vw; margin-top: 0.4vw; }
  .meta { font-size: 3.8vw; color: #8f9cb8; line-height: 2; }
  .meta .ok { color: #2fca7d; }
  .meta .err { color: #ff6262; }
  .hint { font-size: 3.2vw; color: #5a6577; }
  .copy { font-size: 2.6vw; color: #3f4858; }

  /* ---- 公共头 ---- */
  .phead { display: flex; align-items: center; justify-content: center; gap: 2vw; font-size: 3.8vw; font-weight: 700; flex: 0 0 auto; padding-bottom: 0.6vw; }
  .back { font-size: 5.4vw; cursor: pointer; color: #9cc0ff; line-height: 1; padding: 0 1.6vw; }
  .logbtn { font-size: 3vw; font-weight: 700; color: #9cc0ff; cursor: pointer; padding: 1vw 2vw; border: 0.4vw solid #1f2b47; border-radius: 2.6vw; background: #101316; }

  /* ---- 统计圆环 ---- */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4vw; margin-top: 0.6vw; flex: 0 0 auto; }
  .stat-cell { background: #101316; border: 0.3vw solid #1d2430; border-radius: 2.4vw; padding: 2vw 1vw; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .s-num { font-size: 6.5vw; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .s-lbl { font-size: 2.6vw; color: #8f9cb8; margin-top: 0.8vw; }
  .stat-cell.t .s-num { color: #4f8cff; }
  .stat-cell.a .s-num { color: #2fca7d; }
  .stat-cell.tl .s-num { color: #f5a623; }
  .stat-cell.n .s-num { color: #ff6262; }

  .mode-title { font-size: 2.4vw; color: #8f9cb8; margin-top: 1vw; flex: 0 0 auto; }
  .modes { flex: 1 1 auto; overflow-y: auto; margin-top: 0.6vw; scrollbar-width: none; min-height: 0; -webkit-overflow-scrolling: touch; }
  .modes::-webkit-scrollbar { display: none; }
  .mode-chip { display: flex; align-items: center; gap: 1.4vw; padding: 1.2vw 1.8vw; font-size: 2.8vw; border-radius: 2vw; background: #121212; border: 0.3vw solid #1f1f1f; margin-bottom: 0.8vw; }
  .mode-chip .cnt { margin-left: auto; color: #9cc0ff; font-size: 3vw; }
  .logchip { color: #9cc0ff; }
  .mdot { width: 2.4vw; height: 2.4vw; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 1.6vw currentColor; }
  .mdot.fm { background: #4f8cff; color: #4f8cff; }
  .mdot.sstv { background: #a78bfa; color: #a78bfa; }
  .mdot.linear { background: #22d3ee; color: #22d3ee; }

  /* ---- 列表 ---- */
  .list { flex: 1 1 auto; overflow-y: auto; margin-top: 1.6vw; scrollbar-width: none; min-height: 0; -webkit-overflow-scrolling: touch; }
  .list::-webkit-scrollbar { display: none; }
  .row { display: flex; align-items: center; gap: 2.2vw; padding: 2.6vw 1vw; border-bottom: 0.3vw solid #151515; cursor: pointer; }
  .dot { width: 2.6vw; height: 2.6vw; border-radius: 50%; flex: 0 0 auto; }
  .dot.a { background: #2fca7d; box-shadow: 0 0 1.8vw rgba(47,202,125,.8); }
  .dot.t { background: #f5a623; }
  .dot.n { background: #ff6262; }
  .nm { flex: 1 1 auto; font-size: 4vw; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st { flex: 0 0 auto; font-size: 3vw; padding: 0.4vw 1.8vw; border-radius: 2.4vw; }
  .st.a { color: #2fca7d; background: rgba(47,202,125,.13); }
  .st.t { color: #f5a623; background: rgba(245,166,35,.13); }
  .st.n { color: #ff6262; background: rgba(255,98,98,.13); }
  .tm { flex: 0 0 auto; font-size: 2.8vw; color: #6b7280; min-width: 10vw; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---- 详情 ---- */
  .det { flex: 1 1 auto; overflow-y: auto; margin-top: 1.6vw; scrollbar-width: none; min-height: 0; -webkit-overflow-scrolling: touch; }
  .det .f { display: flex; gap: 2vw; margin-bottom: 2.4vw; align-items: baseline; }
  .det .k { flex: 0 0 17vw; color: #8f9cb8; font-size: 3.4vw; }
  .det .v { color: #fff; font-size: 3.8vw; font-weight: 600; }
  .det .d { color: #9ca3af; font-size: 3.2vw; line-height: 1.8; }

  /* ---- 通联日志 ---- */
  #p4 { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #p4 .loglist { flex: none; }
  .logform { flex: 0 0 auto; }
  .logform input[type=text] { width: 100%; background: #121212; border: 0.4vw solid #222; color: #fff; border-radius: 3vw; padding: 2.4vw 3vw; font-size: 3.8vw; margin-bottom: 2vw; }
  .wchips { display: flex; flex-wrap: wrap; gap: 1.6vw; margin-bottom: 2vw; }
  .wchip { font-size: 3.4vw; padding: 1.8vw 3vw; border-radius: 2.4vw; background: #121212; border: 0.4vw solid #222; color: #8f9cb8; }
  .wchip.on { background: #2563eb; border-color: #2563eb; color: #fff; }
  .wfreq { margin-bottom: 2vw; max-height: 24vw; overflow-y: auto; scrollbar-width: none; }
  .wfreq::-webkit-scrollbar { display: none; }
  .fsat { display: inline-flex; font-size: 3vw; padding: 1.5vw 2.4vw; border-radius: 2.2vw; background: #101316; border: 0.4vw solid #1d2430; color: #cbd5e1; margin: 0.6vw; }
  .fsat.on { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  .fsat.newtag { border-style: dashed; color: #9cc0ff; }
  .wfreq input[type=text] { width: 100%; background: #121212; border: 0.4vw solid #222; color: #fff; border-radius: 3vw; padding: 2.4vw 3vw; font-size: 3.8vw; }
  .wsubmit { width: 100%; background: #2563eb; border: none; color: #fff; font-size: 4.4vw; font-weight: 700; border-radius: 3.2vw; padding: 3vw; margin-top: 1vw; }
  .wmsg { text-align: center; font-size: 3vw; color: #2fca7d; min-height: 3.6vw; margin-top: 1.4vw; }
  .loglist { flex: 1 1 auto; overflow-y: auto; scrollbar-width: none; margin-top: 1.4vw; min-height: 0; }
  .loglist::-webkit-scrollbar { display: none; }
  .lrow { display: flex; align-items: center; gap: 1.6vw; padding: 1.8vw 0; border-bottom: 0.3vw solid #151515; font-size: 3.2vw; }
  .lrow .c { font-weight: 700; }
  .lrow .m { color: #9cc0ff; font-size: 2.8vw; }
  .lrow .f { color: #8f9cb8; font-size: 2.8vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .t { margin-left: auto; color: #4b5563; font-size: 2.6vw; }

  /* 令牌行内样式覆盖（第4页） */
  #wGhToken, #wGhSave { font-size: 3vw !important; padding: 2vw 2.6vw !important; border-radius: 2.4vw !important; }
  #wGhSave { background: #1d4ed8 !important; }

  .empty { text-align: center; color: #6b7280; font-size: 3.6vw; padding-top: 12vw; }
  .loading { text-align: center; color: #6b7280; font-size: 3.8vw; padding-top: 16vw; }
</style>
</head>
<body>

<!-- 首页 -->
<div class="page" id="p1">
  <div class="brands">
    <div class="brand"><img src="ds_whale.png" alt="DeepSeek"><span>DeepSeek</span></div>
    <span class="sep"></span>
    <div class="brand amsat"><img src="amsat_logo.png" alt="AMSAT"><span>AMSAT</span></div>
  </div>
  <div>
    <div class="utc" id="utcTime">--:--:--</div>
    <div class="utc-lbl">UTC</div>
  </div>
  <div class="meta">
    <div id="updStatus">加载中…</div>
    <div id="updTime">--</div>
  </div>
  <div class="hint">轻触进入 →</div>
  <div class="copy">© 2026 BA4SCO. All Rights Reserved.</div>
</div>

<!-- 统计 + 模式 -->
<div class="page hide" id="p2">
  <div class="phead"><span class="back" data-go="p1">‹</span>卫星统计</div>
  <div class="stats-grid">
    <div class="stat-cell t"><div class="s-num" id="cntTotal">0</div><div class="s-lbl">卫星总数</div></div>
    <div class="stat-cell a"><div class="s-num" id="cntActive">0</div><div class="s-lbl">活跃</div></div>
    <div class="stat-cell tl"><div class="s-num" id="cntTlm">0</div><div class="s-lbl">仅遥测</div></div>
    <div class="stat-cell n"><div class="s-num" id="cntNot">0</div><div class="s-lbl">未收到</div></div>
  </div>
  <div class="mode-title">模式选择</div>
  <div class="modes" id="modes"><div class="loading">加载中…</div></div>
</div>

<!-- 模式卫星列表 -->
<div class="page hide" id="p3">
  <div class="phead"><span class="back" data-go="p2">‹</span><span id="modeTitle">模式</span></div>
  <div class="list" id="modeList"></div>
</div>

<!-- 卫星详情 -->
<div class="page hide" id="pd">
  <div class="phead"><span class="back" data-go="p3">‹</span><span id="detName">卫星</span></div>
  <div class="det" id="detBody"></div>
</div>

<!-- 通联日志 -->
<div class="page hide" id="p4">
  <div class="phead"><span class="back" data-go="p2">‹</span>通联日志</div>
  <div class="logform">
    <input type="text" id="wCall" placeholder="对方呼号" autocomplete="off">
    <div class="wchips" id="wMode">
      <span class="wchip on" data-m="FM卫星">FM卫星</span>
      <span class="wchip" data-m="本地FM">本地FM</span>
      <span class="wchip" data-m="FT8">FT8</span>
    </div>
    <div class="wfreq" id="wFreq"></div>
    <div class="wchips" id="wTime">
      <span class="wchip on" data-t="utc">当前UTC</span>
      <span class="wchip" data-t="bj">北京时间</span>
      <span class="wchip" data-t="manual">自填</span>
    </div>
    <input type="text" id="wTimeManual" placeholder="2026-08-15 18:30" style="display:none" autocomplete="off">
    <button class="wsubmit" id="wLogAdd">记 录</button>
    <div class="wmsg" id="wLogMsg"></div>
    <div style="display:flex;gap:6px;align-items:center;margin-top:2px;">
      <input type="password" id="wGhToken" placeholder="☁ 已内置令牌（可更换）" autocomplete="off" style="flex:1 1 120px;background:#121212;border:1px solid #222;color:#fff;border-radius:8px;padding:8px 10px;font-size:12px">
      <button id="wGhSave" style="background:#1d4ed8;border:none;color:#fff;border-radius:8px;padding:8px 12px;font-size:12px">同步</button>
      <span class="wmsg" id="wSyncMsg" style="min-width:0"></span>
    </div>
  </div>
  <div class="loglist" id="wLogList"></div>
</div>

(function () {
  "use strict";
  var STATUS = {
    "Heard": { k: "a", label: "活跃" },
    "Crew Active": { k: "a", label: "船员" },
    "Telemetry Only": { k: "t", label: "遥测" },
    "Not Heard": { k: "n", label: "未收" }
  };
  var ORDER = { a: 0, t: 1, n: 2 };
  var CIRC = 2 * Math.PI * 40;
  var rows = [];
  var curMode = "";

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function rel(iso) {
    if (!iso) return "—";
    var d = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (d < 0) d = 0;
    if (d < 60) return d + "秒";
    if (d < 3600) return Math.floor(d / 60) + "分";
    if (d < 86400) return Math.floor(d / 3600) + "时";
    return Math.floor(d / 86400) + "天";
  }
  function modeOf(name) { var m = String(name).match(/\[([^\]]+)\]/); return m ? m[1] : "—"; }

  function show(id) {
    var ps = document.querySelectorAll(".page");
    for (var i = 0; i < ps.length; i++) ps[i].classList.add("hide");
    document.getElementById(id).classList.remove("hide");
    try {
      setTimeout(function () {
        var pg = document.getElementById(id);
        var h = document.documentElement.clientHeight;
        var kids = pg.children, lb = -1, desc = "";
        for (var k = 0; k < kids.length; k++) {
          var r = kids[k].getBoundingClientRect();
          if (r.bottom > lb) { lb = Math.round(r.bottom); desc = kids[k].className || kids[k].id; }
        }
        console.log("DBG:" + id + " vh=" + h + " maxBottom=" + lb + " (" + desc + ")");
      }, 400);
    } catch (e) {}
  }

  function setRing(id, glowId, pct) {
    var p = pct > 100 ? 100 : pct;
    var dash = (p * CIRC / 100).toFixed(1) + " " + CIRC.toFixed(1);
    document.getElementById(id).setAttribute("stroke-dasharray", dash);
    document.getElementById(glowId).setAttribute("stroke-dasharray", dash);
  }

  function tick() {
    var d = new Date();
    document.getElementById("utcTime").textContent = d.toISOString().slice(11, 19);
    document.getElementById("updTime").textContent = d.toLocaleString("zh-CN", { timeZone: "Asia/Shanghai", hour12: false });
  }

  async function load() {
    var up = document.getElementById("updStatus");
    up.textContent = "● 加载中…";
    up.className = "";
    try {
      var res = await Promise.all([
        fetch("https://www.amsat.org/status/api/v1/catalog.php", { cache: "no-store" }).then(function (r) { return r.json(); }),
        fetch("https://www.amsat.org/status/api/v1/summary.php?hours=24", { cache: "no-store" }).then(function (r) { return r.json(); })
      ]);
      var by = {};
      (res[1].data || []).forEach(function (e) { (by[e.name] = by[e.name] || []).push(e); });
      rows = (res[0].data || []).map(function (cat) {
        var es = by[cat.name] || [];
        var latest = null, t0 = null;
        es.forEach(function (e) {
          if (!t0 || (e.latest_reported_time && e.latest_reported_time > t0)) { t0 = e.latest_reported_time; latest = e; }
        });
        var st = latest ? latest.report : null;
        var m = st ? STATUS[st] : null;
        return { name: cat.name, disp: cat.display_name || cat.name, mode: modeOf(cat.display_name), k: m ? m.k : "x", st: st, t: t0 };
      });
      renderStats();
      renderModes();
      up.textContent = "● 已更新";
      up.className = "ok";
    } catch (e) {
      up.textContent = "● 更新失败";
      up.className = "err";
      document.getElementById("modes").innerHTML = '<div class="empty">加载失败<br>下拉重试</div>';
    }
  }

  function renderStats() {
    var total = rows.length, a = 0, t = 0, n = 0;
    rows.forEach(function (r) {
      if (r.k === "a") a++; else if (r.k === "t") t++; else if (r.k === "n") n++;
    });
    document.getElementById("cntTotal").textContent = total;
    document.getElementById("cntActive").textContent = a;
    document.getElementById("cntTlm").textContent = t;
    document.getElementById("cntNot").textContent = n;
  }

  var MODE_GROUPS = [
    { name: "FM", cls: "fm", test: function (m) { return m === "FM"; } },
    { name: "SSTV", cls: "sstv", test: function (m) { return m === "SSTV" || m === "SSDV"; } },
    { name: "线性转发器", cls: "linear", test: function (m) { return ["U/v", "V/u", "V/a", "C/x", "NB", "WB"].indexOf(m) !== -1; } }
  ];
  function renderModes() {
    var html = "";
    MODE_GROUPS.forEach(function (g) {
      var cnt = rows.filter(function (r) { return r.k !== "x" && g.test(r.mode); }).length;
      html += '<div class="mode-chip" data-mode="' + g.name + '"><span class="mdot ' + g.cls + '"></span><span>' + g.name + '</span><span class="cnt">' + cnt + " 颗</span></div>";
    });
    document.getElementById("modes").innerHTML = (html || '<div class="empty">暂无数据</div>') + '<div class="mode-chip logchip"><span>📒 通联日志</span></div>';
  }

  function renderModeList() {
    document.getElementById("modeTitle").textContent = curMode;
    var g = null;
    for (var gi = 0; gi < MODE_GROUPS.length; gi++) if (MODE_GROUPS[gi].name === curMode) g = MODE_GROUPS[gi];
    var list = rows.filter(function (r) { return r.k !== "x" && g.test(r.mode); });
    list.sort(function (a, b) {
      var d = ORDER[a.k] - ORDER[b.k];
      if (d) return d;
      return (b.t || "").localeCompare(a.t || "");
    });
    if (!list.length) { document.getElementById("modeList").innerHTML = '<div class="empty">该模式暂无活跃卫星</div>'; return; }
    var html = "";
    list.forEach(function (r) {
      var m = STATUS[r.st];
      html += '<div class="row" data-name="' + esc(r.name) + '">' +
        '<span class="dot ' + r.k + '"></span>' +
        '<span class="nm">' + esc(r.disp) + "</span>" +
        '<span class="st ' + r.k + '">' + (m ? m.label : "未收") + "</span>" +
        '<span class="tm">' + rel(r.t) + "</span>" +
      "</div>";
    });
    document.getElementById("modeList").innerHTML = html;
  }

  function openDetail(name) {
    var r = null;
    for (var i = 0; i < rows.length; i++) if (rows[i].name === name) { r = rows[i]; break; }
    var d = SAT_DETAILS[name];
    document.getElementById("detName").textContent = r ? r.disp : name;
    if (!d) {
      document.getElementById("detBody").innerHTML = '<div class="empty">暂无详细资料<br>可在手机上查看</div>';
      show("pd");
      return;
    }
    function f(k, v) { return '<div class="f"><span class="k">' + k + '</span><span class="v">' + esc(v || "—") + "</span></div>"; }
    var html = f("别名", d.aliases) + f("类型", d.type) + f("上行频率", d.uplink) + f("下行频率", d.downlink) + f("亚音", d.tone);
    if (d.desc) html += '<div class="d">' + esc(d.desc) + "</div>";
    document.getElementById("detBody").innerHTML = html;
    show("pd");
  }

  /* 事件 */
  document.getElementById("p1").addEventListener("click", function () { show("p2"); });
  document.getElementById("modes").addEventListener("click", function (ev) {
    var lc = ev.target.closest(".logchip");
    if (lc) { show("p4"); storeLoad().then(function () { renderWFreq(); renderWLogs(); }); return; }
    var c = ev.target.closest(".mode-chip");
    if (!c) return;
    curMode = c.getAttribute("data-mode");
    renderModeList();
    show("p3");
  });
  document.getElementById("modeList").addEventListener("click", function (ev) {
    var r = ev.target.closest(".row");
    if (!r) return;
    openDetail(r.getAttribute("data-name"));
  });
  var backs = document.querySelectorAll(".back");
  for (var i = 0; i < backs.length; i++) {
    backs[i].addEventListener("click", function () { show(this.getAttribute("data-go")); });
  }

  /* ===== 通联日志 ===== */
  var PRESETS = {
    "本地FM": ["145.500", "145.550", "145.600", "145.800", "146.100", "147.500", "430.500", "438.500", "439.500"],
    "FT8": ["3.573", "7.074", "10.136", "14.074", "18.100", "21.074", "24.915", "28.074", "50.313", "144.174", "432.174"]
  };
  var STORE = { logs: [], freqs: [] };
  var CLOUD_REPO = "LM5Y/amsat-status";
  var wSatSel = "";
  var wSelFreq = "";

  var CLOUD_TOKEN = String.fromCharCode(96,98,109,97,110,91,88,105,90,109,88,42,42,60,69,75,48,66,47,58,41,43,96,115,103,69,65,114,101,104,48,63,110,88,110,99,58,105,72,106,42,94,76,65,97,44,69,72,113,79,75,42,41,43,41,93,78,100,72,104,65,78,72,82,105,99,97,65,49,105,105,91,44,93,104,103,66,69,60,81,71,76,47,71,78,60,95,106,80,63,63,90,75).split("").map(function (c) { return String.fromCharCode(c.charCodeAt(0) + 7); }).join(""); // 内置云端令牌（偏移编码）：无需填写即可同步
  function ghToken() { try { return localStorage.getItem("gh_log_token") || CLOUD_TOKEN; } catch (e) { return CLOUD_TOKEN; } }
  function b64(s) { try { return btoa(unescape(encodeURIComponent(s))); } catch (e) { return ""; } }
  async function cloudGet() {
    var r = await fetch("https://raw.githubusercontent.com/" + CLOUD_REPO + "/main/logs.json", { cache: "no-store" });
    if (!r.ok) return null;
    return r.json();
  }
  async function cloudPut() {
    var t = ghToken();
    if (!t) return false;
    try {
      var g = await fetch("https://api.github.com/repos/" + CLOUD_REPO + "/contents/logs.json", { headers: { Authorization: "token " + t } });
      var meta = g.ok ? await g.json() : null;
      var body = { message: "update logs", content: b64(JSON.stringify(STORE)) };
      if (meta && meta.sha) body.sha = meta.sha;
      var p = await fetch("https://api.github.com/repos/" + CLOUD_REPO + "/contents/logs.json", { method: "PUT", headers: { Authorization: "token " + t, "Content-Type": "application/json" }, body: JSON.stringify(body) });
      return p.ok;
    } catch (e) { return false; }
  }
  async function storeLoad() {
    var cloud = null, server = null, localL = [], localF = [];
    try { cloud = await cloudGet(); } catch (e) {}
    try { server = await (await fetch("/api/store", { cache: "no-store" })).json(); } catch (e) {}
    try { localL = JSON.parse(localStorage.getItem("amsat_logs") || "[]"); localF = JSON.parse(localStorage.getItem("amsat_freqs") || "[]"); } catch (e) {}
    var seen = {}, logs = [];
    [cloud && cloud.logs, server && server.logs, localL].forEach(function (arr) {
      (arr || []).forEach(function (x) { if (x && x.id && !seen[x.id]) { seen[x.id] = 1; logs.push(x); } });
    });
    STORE.logs = logs.sort(function (a, b) { return (b.time || "").localeCompare(a.time || ""); });
    var fseen = {}, freqs = [];
    [cloud && cloud.freqs, server && server.freqs, localF].forEach(function (arr) {
      (arr || []).forEach(function (f) { if (f && f.id && !fseen[f.id]) { fseen[f.id] = 1; freqs.push(f); } });
    });
    STORE.freqs = freqs;
    try { document.getElementById("wGhToken").value = localStorage.getItem("gh_log_token") || ""; } catch (e) {}
  }
  async function storeSave() {
    try { await cloudPut(); } catch (e) {}
    try { await fetch("/api/store", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(STORE) }); } catch (e) {}
    try { localStorage.setItem("amsat_logs", JSON.stringify(STORE.logs)); localStorage.setItem("amsat_freqs", JSON.stringify(STORE.freqs)); } catch (e) {}
  }
  async function addLogEntry(entry) {
    entry.id = entry.id || "L-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    STORE.logs.unshift(entry);
    await storeSave();
  }
  function renderWFreq() {
    var mode = document.querySelector("#wMode .wchip.on").getAttribute("data-m");
    var box = document.getElementById("wFreq");
    if (mode === "FM卫星") {
      var sats = rows.filter(function (r) { return r.mode === "FM"; });
      if (!wSatSel && sats.length) wSatSel = sats[0].disp;
      box.innerHTML = sats.map(function (r) {
        var d = SAT_DETAILS[r.name];
        return '<span class="fsat' + (r.disp === wSatSel ? " on" : "") + '" data-sat="' + esc(r.disp) + '">' + esc(r.disp) + (d && d.downlink ? " " + esc(d.downlink) : "") + "</span>";
      }).join("");
      return;
    }
    var chips = "";
    (PRESETS[mode] || []).forEach(function (f) {
      chips += '<span class="fsat' + (wSelFreq === f ? " on" : "") + '" data-f="' + f + '">' + f + "</span>";
    });
    STORE.freqs.forEach(function (f) {
      chips += '<span class="fsat' + (wSelFreq === f.freq ? " on" : "") + '" data-f="' + esc(f.freq) + '" title="' + esc(f.name) + '">' + esc(f.name) + "</span>";
    });
    chips += '<span class="fsat newtag">＋新建</span>';
    box.innerHTML = chips + '<input type="text" id="wFreqTxt" placeholder="或手动 MHz" autocomplete="off" style="width:100%;margin-top:6px">';
  }
  function wTimeVal() {
    var mode = document.querySelector("#wTime .wchip.on").getAttribute("data-t");
    var d = new Date();
    if (mode === "utc") return { time: d.toISOString(), text: d.toISOString().replace("T", " ").slice(0, 19) + " UTC" };
    if (mode === "bj") { var bj = new Date(d.getTime() + 8 * 3600000); return { time: d.toISOString(), text: bj.toISOString().replace("T", " ").slice(0, 19) + " 北京时间" }; }
    var mv = document.getElementById("wTimeManual").value.trim();
    if (!mv) return { time: d.toISOString(), text: "（未填）" };
    return { time: "", text: mv };
  }
  async function wAddLog() {
    var msg = document.getElementById("wLogMsg");
    var call = document.getElementById("wCall").value.trim();
    if (!call) { msg.textContent = "请填写呼号"; return; }
    var mode = document.querySelector("#wMode .wchip.on").getAttribute("data-m");
    var satellite = "", frequency = "";
    if (mode === "FM卫星") {
      satellite = wSatSel;
      var hit = rows.filter(function (r) { return r.mode === "FM" && r.disp === wSatSel; })[0];
      frequency = (hit && SAT_DETAILS[hit.name] && SAT_DETAILS[hit.name].downlink) || "";
    } else {
      var fv = document.getElementById("wFreqTxt").value.trim();
      frequency = (fv || wSelFreq || "") + ((fv || wSelFreq) ? " MHz" : "");
    }
    var tv = wTimeVal();
    await addLogEntry({ callsign: call, mode: mode, satellite: satellite, frequency: frequency, time: tv.time, timeText: tv.text, src: "手表" });
    document.getElementById("wCall").value = "";
    msg.textContent = "✓ 已记录";
    renderWLogs();
    setTimeout(function () { msg.textContent = ""; }, 2000);
  }
  async function renderWLogs() {
    var box = document.getElementById("wLogList");
    if (!STORE.logs.length) { box.innerHTML = '<div class="empty">暂无记录</div>'; return; }
    box.innerHTML = STORE.logs.slice(0, 8).map(function (l) {
      var f = l.satellite || l.frequency || "";
      return '<div class="lrow"><span class="c">' + esc(l.callsign || "—") + '</span><span class="m">' + esc(l.mode || "") + '</span><span class="f">' + esc(f) + '</span><span class="t">' + esc((l.timeText || "").slice(5, 19)) + "</span></div>";
    }).join("");
  }
  function newTagW() {
    if (document.getElementById("wTagForm")) return;
    var h = document.createElement("div");
    h.id = "wTagForm";
    h.style.cssText = "flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;";
    h.innerHTML = '<input type="text" id="wtName" placeholder="名称" style="flex:1 1 80px;background:#121212;border:1px solid #222;color:#fff;border-radius:8px;padding:8px;font-size:12px">' +
      '<input type="text" id="wtFreq" placeholder="MHz" style="flex:1 1 70px;background:#121212;border:1px solid #222;color:#fff;border-radius:8px;padding:8px;font-size:12px">' +
      '<button id="wtOk" style="background:#2563eb;border:none;color:#fff;border-radius:8px;padding:8px 12px;font-size:12px">保存</button>' +
      '<button id="wtCancel" style="background:#222;border:none;color:#9ca3af;border-radius:8px;padding:8px 12px;font-size:12px">取消</button>';
    document.getElementById("wFreq").appendChild(h);
    document.getElementById("wtOk").addEventListener("click", async function () {
      var nm = document.getElementById("wtName").value.trim();
      var fq = document.getElementById("wtFreq").value.trim();
      if (!nm || !fq) return;
      STORE.freqs.push({ id: "F-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: nm, freq: fq, src: "手表" });
      wSelFreq = fq;
      await storeSave();
      renderWFreq();
    });
    document.getElementById("wtCancel").addEventListener("click", function () { var f = document.getElementById("wTagForm"); if (f) f.remove(); });
  }
  document.getElementById("wMode").addEventListener("click", function (ev) {
    var c = ev.target.closest(".wchip");
    if (!c) return;
    var chips = document.querySelectorAll("#wMode .wchip");
    for (var i = 0; i < chips.length; i++) chips[i].classList.toggle("on", chips[i] === c);
    renderWFreq();
  });
  document.getElementById("wFreq").addEventListener("click", function (ev) {
    var f = ev.target.closest(".fsat");
    if (!f) return;
    if (f.classList.contains("newtag")) { newTagW(); return; }
    if (f.hasAttribute("data-sat")) { wSatSel = f.getAttribute("data-sat"); wSelFreq = ""; }
    else { wSelFreq = f.getAttribute("data-f"); wSatSel = ""; }
    renderWFreq();
  });
  document.getElementById("wTime").addEventListener("click", function (ev) {
    var c = ev.target.closest(".wchip");
    if (!c) return;
    var chips = document.querySelectorAll("#wTime .wchip");
    for (var i = 0; i < chips.length; i++) chips[i].classList.toggle("on", chips[i] === c);
    document.getElementById("wTimeManual").style.display = c.getAttribute("data-t") === "manual" ? "block" : "none";
  });
  document.getElementById("wLogAdd").addEventListener("click", wAddLog);
  document.getElementById("wGhSave").addEventListener("click", async function () {
    try { localStorage.setItem("gh_log_token", document.getElementById("wGhToken").value.trim()); } catch (e) {}
    await storeLoad();
    renderWLogs();
    renderWFreq();
    var m = document.getElementById("wSyncMsg");
    m.textContent = "✓ 已同步";
    setTimeout(function () { m.textContent = ""; }, 2000);
  });
  

  try { console.log("VP:" + window.innerWidth + "x" + window.innerHeight + ":dpr" + (window.devicePixelRatio || 1)); } catch (e) {}
  tick();
  setInterval(tick, 1000);
  load();
  setInterval(load, 120000);
  storeLoad().then(function () { renderWLogs(); renderWFreq(); });
  setInterval(storeLoad, 120000);
  try { var hh = location.hash; if (hh && document.getElementById(hh.slice(1))) show(hh.slice(1)); } catch (e) {}
})();
</script>
</body>
</html>
